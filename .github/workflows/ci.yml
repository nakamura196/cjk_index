name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ruby: ["3.1", "3.3", "3.4", "4.0"]
        include:
          # pure Ruby: no native extension, so it should pass on every platform
          - { os: macos-latest, ruby: "4.0" }
          - { os: windows-latest, ruby: "4.0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      # node is preinstalled on the GitHub-hosted runners; the runtime tests use it
      - run: bundle exec rake test
